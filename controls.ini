# Xbox controller mapping for Fighting Layer. Applies to both controllers
# (controller 1 = player 1, controller 2 = player 2). Delete a line to use the default.
#
# Cabinet buttons: the top row is 1 2 3, the bottom row is 4 5 6 (as in the test menu's SWITCH TEST).
# Controller names: A B X Y LB RB LT RT START BACK (or VIEW/MENU) LS RS DUP DDOWN DLEFT DRIGHT NONE
# Up to two controller buttons per line, e.g.  coin = BACK LB
#
# Movement always uses both the D-pad and the left stick.

b1 = X
b2 = Y
b3 = RB
b4 = A
b5 = B
b6 = RT
start = START
coin = BACK

# How far the left stick must move before it counts (0.1 - 0.9)
stick_deadzone = 0.35
